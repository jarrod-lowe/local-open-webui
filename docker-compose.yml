version: '3.8'

services:
  open-webui:
    build:
      context: ./open-webui
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /persistent-data
      WEBUI_AUTH: "false"
    volumes:
      - open-webui-data:/persistent-data
    networks:
      - app-network

  bedrock-gateway:
    build:
      context: ./bedrock-gateway
      dockerfile: Dockerfile
    environment:
      AWS_PROFILE: open-webui-access
    #  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    #  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    #  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - "8000:8000"
    networks:
      - app-network

volumes:
  open-webui-data:
    driver: local

networks:
  app-network:
    driver: bridge